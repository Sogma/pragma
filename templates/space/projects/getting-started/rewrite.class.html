<!DOCTYPE html>
<html data-format="class" data-format-version="1.0">
<head>
  <meta charset="utf-8">
  <title>Rewrite</title>
</head>
<body>

  <dl data-role="metadata">
    <dt>description</dt><dd>Every document in the space tagged rewrite. Each one gets the Rewrite Selection Flow's buttons.</dd>
  </dl>

  <ul data-role="filter">
    <li data-property="file.tags" data-test="has">rewrite</li>
  </ul>

  <ul data-role="links">
    <li>rewrite-selection.flow.html</li>
  </ul>

  <table data-role="fields">
    <thead>
      <tr>
        <th data-field="file.folder" data-type="text">Folder</th>
        <th data-field="file.tags" data-type="text">All tags</th>
      </tr>
    </thead>
  </table>

  <ol data-role="views">
  </ol>

</body>
</html>
