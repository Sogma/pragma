name: Release desktop app

# Builds the macOS, Windows and Linux installers for a v* tag and uploads them,
# with their electron-updater metadata (latest-mac.yml, latest.yml,
# latest-linux.yml), to a **draft** GitHub Release, then stops. The npm
# package's tarball, tried out here first, goes on the draft too. The draft is
# a staging area: download the installers from it, smoke-test them, edit the
# notes, then run the "Publish release" workflow (publish.yml) to make it live.
#
# The tag must already exist. Normal path: `npm version patch` (its `postversion`
# hook runs `git push --follow-tags`). Manual re-run of a build: the
# workflow_dispatch form below, passing an existing tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build into its draft release, e.g. v0.1.7"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-draft:
    # A pushed tag releases only from sogma/pragma itself: in a fork or mirror
    # the build couldn't publish to the feed. The jobs below skip with this one,
    # and a manual run still builds anywhere.
    if: github.event_name != 'push' || github.repository == 'sogma/pragma'
    runs-on: ubuntu-latest
    steps:
      # Pre-create the draft so the platform build jobs below all find it by tag
      # and upload into the same release, instead of racing to create it and
      # leaving duplicate drafts (electron-builder matches an existing draft by
      # tag_name; see electron-publish/out/gitHubPublisher.js getOrCreateRelease).
      - name: Create the draft release if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$TAG" --generate-notes
          fi

  build:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci

      # electron-builder finds the draft release by tag and uploads the installer
      # + latest*.yml to it (publish.releaseType: draft in electron-builder.yml).
      - name: Package and upload
        if: runner.os != 'macOS'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The same upload, signed and notarized. electron-builder skips signing
      # without CSC_LINK, and notarizing without all three APPLE_* secrets, with
      # only a warning, so a missing one fails the job here instead.
      # CSC_IDENTITY_AUTO_DISCOVERY=false skips signing even with CSC_LINK set,
      # so it stays off this step.
      #
      # The secrets sit on this step alone: npm ci runs dependencies' install
      # scripts, and a Windows build signs with CSC_LINK when WIN_CSC_LINK is
      # unset.
      - name: Package, sign, notarize and upload
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          npm run release

      # Belt and suspenders: keep the built installers reachable if the upload
      # to the draft failed partway. Only then, and briefly: one run's
      # installers come to about 1 GB of artifact storage.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
            release/*.yml
          if-no-files-found: warn
          retention-days: 2

  # One tarball serves every platform: packed, installed and run here, then
  # attached to the draft beside the installers.
  npm-package:
    needs: create-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Its prepare script builds dist/web, which the package carries.
      - run: npm ci

      - run: npm run pack:npm

      # The tarball is named for package.json's version, so a tag that doesn't
      # match it finds no tarball and fails the job.
      - name: Try out the tarball and attach it to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tarball="dist/sogma-pragma-${TAG#v}.tgz"
          if [ ! -f "$tarball" ]; then
            echo "::error::No $tarball: package.json's version doesn't match $TAG."
            exit 1
          fi
          node scripts/smoke-npm.mjs "$tarball"
          gh release upload "$TAG" "$tarball" --clobber --repo "$GITHUB_REPOSITORY"

  summary:
    needs: [build, npm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Link the draft and the publish step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "### Draft release \`$TAG\` is built"
            echo ""
            echo "1. Download and smoke-test the installers: $URL"
            echo "2. Edit the release notes on that page."
            echo "3. Run the **Publish release** workflow with \`tag=$TAG\` to make it live."
          } >> "$GITHUB_STEP_SUMMARY"
