name: CI

# Lint, docs check (scripts/check-docs.mjs), typecheck, the unit suite, the npm
# package packed and tried out as release.yml does it, and the e2e suite
# (vitest.config.ts / playwright.config.ts) on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci

      - run: npm run lint

      - run: npm run check:docs

      - run: npm run typecheck

      - run: npm run test:unit

      # Packs the dist/web that npm ci built (the prepare script).
      - run: npm run pack:npm

      - run: node scripts/smoke-npm.mjs dist/sogma-pragma-*.tgz

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
